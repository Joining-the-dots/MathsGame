<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metals client database — private wealth</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172b40; background: #f7f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    main { width: min(100%, 680px); padding: clamp(28px, 6vw, 60px); background: white; border-top: 5px solid #b4924f; box-shadow: 0 12px 50px #172b4010; }
    .brand { margin: 0 0 40px; color: #526272; font-size: .8rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 22px; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.12; font-weight: 650; }
    p { line-height: 1.6; }
    .button { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 4px; background: #172b40; color: white; text-decoration: none; font-weight: 600; }
    .button:hover { background: #29455f; }
    .button:focus-visible { outline: 3px solid #b4924f; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Metals client database</p>
    <h1>Wealth: CH &middot; DE &middot; FOs</h1>
    <p>Private-wealth precious metals research covering 37 Swiss institutions, 24 German institutions and 24 family offices.</p>
    <a class="button" href="mathsgame/">Open the 85-institution database &rarr;</a>
  </main>
</body>
</html>
