<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="752" viewBox="0 0 1000 752" role="img" aria-labelledby="title desc">
<title id="title">Alternative tariff scenarios from fixed US silver capacity</title>
<desc id="desc">At 65 dollars per ounce, use a fixed 50 percent pool of 35.084 million ounces. Show the initial 10 percent trade separately. Alternative A deploys 20 percent of the pool, 7.017 million ounces, at a 10 percent tariff for 38.77 million dollars gross. Alternative B deploys 40 percent, 14.034 million ounces, at a 20 percent tariff for 155.07 million dollars gross. Both capture 85 percent of the implied tariff. Do not add the outcomes.</desc>
<rect width="1000" height="752" fill="white"/>
<rect x="0" y="0" width="1000" height="99" rx="4" fill="#173446"/>
<text x="20" y="25" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#d2e5e9" text-anchor="start">SLV NEW YORK INVENTORY</text>
<text x="425" y="25" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#d2e5e9" text-anchor="start">Proposed custodian: Citigroup / Trustee: BNY Mellon</text>
<text x="20" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="start">70.169m oz</text>
<text x="251" y="63" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="white" text-anchor="start">$4.561bn at $65/oz</text>
<text x="20" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#d2e5e9" text-anchor="start">23 Sep 2026 bar list. UK: 423.364m oz / $27.519bn. At $65/oz.</text>
<line x1="24" y1="106" x2="24" y2="125" stroke="#007e80" stroke-width="2"/>
<polygon points="24,132 19,124 29,124" fill="#007e80"/>
<text x="57" y="132" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#173446" text-anchor="start">50% assumed service capacity</text>
<text x="57" y="160" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#173446" text-anchor="start">35.084m oz / $2.280bn reference notional</text>
<text x="57" y="183" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#526574" text-anchor="start">The fixed pool used for every allocation below.</text>
<line x1="0" y1="202" x2="1000" y2="202" stroke="#d9e3e7" stroke-width="1"/>
<text x="20" y="232" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#007e80" text-anchor="start">INITIAL DEFERRED POSITION</text>
<text x="20" y="262" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#173446" text-anchor="start">10% of the pool: 3.508m oz</text>
<text x="20" y="290" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#173446" text-anchor="start">Short deferred CME / long London over-the-counter forward</text>
<text x="20" y="316" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#526574" text-anchor="start">50c/oz illustrative edge. Initial result kept separate from tariff cases.</text>
<text x="563" y="260" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#173446" text-anchor="start">$1.75m</text>
<text x="563" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#526574" text-anchor="start">illustrative gross</text>
<text x="750" y="246" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#007e80" text-anchor="start">Citigroup $877k</text>
<text x="750" y="275" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#007e80" text-anchor="start">BlackRock $877k</text>
<text x="20" y="344" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#a56524" text-anchor="start">[Add forward EFP charts here: CME minus London forward to first delivery day]</text>
<line x1="0" y1="362" x2="1000" y2="362" stroke="#d9e3e7" stroke-width="1"/>
<text x="500" y="391" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#007e80" text-anchor="middle">ALTERNATIVE TARIFF SCENARIOS</text>
<text x="500" y="416" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#526574" text-anchor="middle">Both use the original 35.084m oz pool</text>
<line x1="500" y1="427" x2="500" y2="442" stroke="#007e80" stroke-width="2"/>
<line x1="244" y1="442" x2="756" y2="442" stroke="#007e80" stroke-width="2"/>
<line x1="244" y1="442" x2="244" y2="453" stroke="#007e80" stroke-width="2"/>
<polygon points="244,460 239,452 249,452" fill="#007e80"/>
<line x1="756" y1="442" x2="756" y2="453" stroke="#007e80" stroke-width="2"/>
<polygon points="756,460 751,452 761,452" fill="#007e80"/>
<text x="20" y="487" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#007e80" text-anchor="start">10% US TARIFF</text>
<text x="20" y="520" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#173446" text-anchor="start">20% of pool: 7.017m oz</text>
<text x="20" y="550" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#173446" text-anchor="start">$65 x 10% x 85% = $5.525/oz</text>
<text x="20" y="599" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#173446" text-anchor="start">$38.77m</text>
<text x="20" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#526574" text-anchor="start">gross capture</text>
<text x="252" y="584" font-family="Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#007e80" text-anchor="start">Citigroup $19.38m</text>
<text x="252" y="616" font-family="Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#007e80" text-anchor="start">BlackRock $19.38m</text>
<text x="544" y="487" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#007e80" text-anchor="start">20% US TARIFF</text>
<text x="544" y="520" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#173446" text-anchor="start">40% of pool: 14.034m oz</text>
<text x="544" y="550" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#173446" text-anchor="start">$65 x 20% x 85% = $11.05/oz</text>
<text x="544" y="599" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#173446" text-anchor="start">$155.07m</text>
<text x="544" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#526574" text-anchor="start">gross capture</text>
<text x="776" y="584" font-family="Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#007e80" text-anchor="start">Citigroup $77.54m</text>
<text x="776" y="616" font-family="Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#007e80" text-anchor="start">BlackRock $77.54m</text>
<text x="500" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#a56524" text-anchor="middle">OR</text>
<rect x="0" y="651" width="1000" height="101" rx="4" fill="#e8f3f2"/>
<text x="20" y="679" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#007e80" text-anchor="start">Revenue sharing: 50% BlackRock / 50% Citigroup</text>
<text x="20" y="706" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#526574" text-anchor="start">Scenario figures show gross capture before costs.</text>
<text x="20" y="734" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#173446" text-anchor="start">Payable share: 50% each of realised net revenue after agreed deductions.</text>
</svg>